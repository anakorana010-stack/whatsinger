name: Build Android APK
on:
workflow_dispatch:
jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout code
uses: actions/checkout@v4
- name: Setup Node
uses: actions/setup-node@v4
with:
node-version: '18'
- name: Install dependencies
run: npm install
- name: Build APK with EAS
run: npx eas-cli build -p android --profile production --non-interactive --output app.apk
env:
EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
- name: Upload APK
uses: actions/upload-artifact@v4
with:
name: whatsinger-apk
path: app.apk
